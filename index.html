<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Của Tôi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Nền màu xanh D9FFFE kết hợp họa tiết chấm bi xen kẽ giữa FEC2E0 và FC98C5 */
      background-color: #D9FFFE;
      background-image: 
        radial-gradient(#FEC2E0 20%, transparent 20%),
        radial-gradient(#FC98C5 20%, transparent 20%);
      background-position: 0 0, 20px 20px;
      background-size: 40px 40px;
      color: #333;
      line-height: 1.8;
      transition: background-color 0.4s ease;
    }

    /* Thanh công cụ điều khiển cố định ở trên cùng */
    .controls-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      z-index: 1000;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #444;
    }

    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      cursor: pointer;
      background: none;
    }

    /* Khung nội dung liền mạch dài vô tận */
    .continuous-content {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      padding: 40px 20px 100px 20px;
    }

    .text-section {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    /* Ô nhập văn bản */
    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border: 2px solid #FEC2E0;
      border-radius: 12px;
      font-size: 1rem;
      resize: none;
      overflow: hidden;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: border-color 0.3s;
    }

    textarea:focus {
      border-color: #FC98C5;
    }

    /* Dòng hiển thị văn bản trực tiếp */
    .live-text {
      margin-top: 25px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.85);
      border-left: 5px solid #FC98C5;
      border-radius: 8px;
      font-size: 1.1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>


  <div class="container continuous-content">
    
    <div class="text-section">
      <h1>rules (*･ω･)ﾉ</h1>
    </div>

    <div class="text-section">
      <textarea id="user-input-1" placeholder="Nhập suy nghĩ, ghi chú hoặc nội dung của bạn vào đây...">♥︎ seller
    • chỉ dùng duy nhất hai acc: Vụn Bánh Quy và Ngáp Ngáp Ngáp.
    • mình nhận chuyển khoản và gdtt nếu bạn ở khu vực TP. Hạ Long.
    • không nhận giao dịch nhạy cảm defect, nhạy cảm phí gói.
    • first pay first get.
    • đã chốt không huỷ ngang, huỷ ngang rf 30% giá trị sản phẩm giúp mình.
    • keep max 2 tuần, cọc 30-50%, huỷ ngang sẽ mất cọc.
    • phí gói mình mặc định 3-5k tuỳ đơn.
    • dlck là 24h sau video check ạ.
    • trễ dlck sau 2 ngày mình xin phép huỷ.
    • phí ship mặc định 14k nếu là spx, còn nếu bạn muốn mình đi bằng vtp thì bạn tạo mvd hộ mình.   
    • trường hợp mất hàng do đvvc thì mình xin phép chỉ rf số tiền đvvc rf cho mình.
    • mình chỉ giải quyết trong trường hợp có đầy đủ video unbox từ đầu đến cuối không cắt ghép.
    • mình chỉ nhận giải quyết sau 3 ngày nhận hàng, sau 3 ngày mình xin phép không xử lý ạ.</textarea>
    </div>

    <div class="text-section">
      <textarea id="user-input-2" placeholder="Nhập suy nghĩ, ghi chú hoặc nội dung của bạn vào đây...">★ buyer
    • mình không nhạy cảm defect nhưng hãy thông báo đầy đủ tình trạng sản phẩm cho mình ạ.
    • có dời thời gian ship thì báo mình.
    • trong thời gian giao dịch mà seller bị cbgd/cngd mình xin phép huỷ giao dịch.
    • mình thường chuyển khoản luôn nhưng nếu mình trễ mong seller nhắc mình ạ.
    • nếu seller có thu phí gói mong bạn gói đúng với số tiền mình bỏ ra ạ.</textarea>
    </div>

  </div>

  <script>
    // Các ô nhập tự động giãn chiều cao theo nội dung (nền sẽ dài ra theo)
    const userInputs = document.querySelectorAll('textarea');
    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    userInputs.forEach(el => {
      el.addEventListener('input', () => autoGrow(el));
      autoGrow(el);
    });
  </script>

</body>
</html>
